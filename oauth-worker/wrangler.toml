name = "atelier-oauth"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# The Client ID is not a secret — it's fine in version control.
# Replace after creating the GitHub App (see oauth-worker/README.md).
GITHUB_CLIENT_ID = "REPLACE-ME"

# The only site allowed to receive login tokens. Must be the exact origin
# (scheme + host, no trailing slash) the CMS runs on — update it when the
# site moves to its own domain, or logins will stop working.
SITE_ORIGIN = "https://atelier.joancorreasilva.workers.dev"

# GITHUB_CLIENT_SECRET is deliberately NOT here. Secrets never go in a file
# that lands in git. Set it once with:
#   npm run oauth:secret   (from the repository root)
