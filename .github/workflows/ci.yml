# Continuous Integration.
#
# Cloudflare Workers Builds already rebuilds and deploys the site on every
# push — that's the "CD" half. This workflow is the "CI" half: it independently verifies the
# site actually builds and type-checks, and it runs on pull requests, so a
# mistake is caught *before* it reaches the live site rather than after.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches ~/.npm between runs so installs don't re-download everything.
          cache: npm

      # "npm ci" (not "npm install") installs the exact versions pinned in
      # package-lock.json and fails if the lockfile is out of sync — which is
      # what you want in CI: reproducible, no surprise upgrades.
      - name: Install dependencies
        run: npm ci

      # Catches type errors and, importantly, content that violates the schema
      # in src/content.config.ts (e.g. a piece missing its year).
      - name: Type-check and validate content
        run: npm run check

      - name: Build site
        run: npm run build
