<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keep the editor out of search results. -->
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Decap CMS is a single JavaScript app loaded from a CDN. It reads its
         entire configuration (which fields exist, where files get saved) from
         config.yml sitting next to this file. There is no build step and no
         server: it runs in the browser and commits directly to GitHub. -->
    <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
  </body>
</html>
