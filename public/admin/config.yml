# Decap CMS configuration.
# This file is the single source of truth for what the artist sees in the
# editor. Every field below must stay in sync with the schema in
# src/content.config.ts — if they drift, the CMS will happily save a file
# that then fails the Astro build.

backend:
  name: github
  repo: joancs/atelier
  branch: main
  # The small service in oauth-worker/ that performs the GitHub login
  # handshake. Its SITE_ORIGIN setting must match this site's URL.
  base_url: https://atelier-oauth.joancorreasilva.workers.dev

# Where uploaded images are committed in the repo (path from the repo root).
media_folder: 'src/assets/artwork'
# The literal path prefix written into each entry's frontmatter. It's relative
# because entries live in src/content/artwork/, so "../../assets/artwork/x.jpg"
# resolves to src/assets/artwork/x.jpg — which is what Astro's image()
# validator expects.
public_folder: '../../assets/artwork'

collections:
  - name: 'artwork'
    label: 'Artwork'
    label_singular: 'Piece'
    folder: 'src/content/artwork'
    create: true
    slug: '{{slug}}'
    extension: 'md'
    format: 'frontmatter'
    summary: '{{title}} ({{year}})'
    sortable_fields: ['year', 'title']
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Year', name: 'year', widget: 'number', value_type: 'int', min: 1900, max: 2100 }
      - { label: 'Medium', name: 'medium', widget: 'string', hint: 'e.g. Oil on canvas' }
      - { label: 'Dimensions', name: 'dimensions', widget: 'string', required: false, hint: 'e.g. 90 x 120 cm' }
      - { label: 'Image', name: 'image', widget: 'image' }
      - {
          label: 'Image description',
          name: 'imageAlt',
          widget: 'string',
          hint: 'Describe the image for visitors using a screen reader, and for search engines.',
        }
      - { label: 'Description', name: 'description', widget: 'text', required: false }
      - {
          label: 'Feature on gallery homepage',
          name: 'featured',
          widget: 'boolean',
          default: false,
          required: false,
        }
